plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

neoForge {
    version = project.property('neoforge_version')

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${project.property('mod_id')}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // The rules engine. Its classes are copied into the mod jar below, so the
    // shipped file is self-contained. Gson is already on the Minecraft runtime
    // classpath, so it is not bundled.
    implementation project(':core')
}

// Expand the mod metadata from gradle.properties so the version is declared once.
tasks.named('processResources', ProcessResources).configure {
    def replacements = [
            mod_id         : project.property('mod_id'),
            mod_name       : project.property('mod_name'),
            mod_version    : project.property('mod_version'),
            mod_license    : project.property('mod_license'),
            mod_authors    : project.property('mod_authors'),
            mod_description: project.property('mod_description'),
            minecraft_version: project.property('minecraft_version'),
            neoforge_version : project.property('neoforge_version')
    ]
    inputs.properties replacements
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replacements
    }
}

base {
    archivesName = project.property('mod_id')
}

jar {
    // Embed the rules engine so the mod is one file in the mods/ folder.
    from project(':core').sourceSets.main.output

    manifest {
        attributes([
                'Specification-Title'   : project.property('mod_id'),
                'Specification-Vendor'  : project.property('mod_authors'),
                'Specification-Version' : '1',
                'Implementation-Title'  : project.property('mod_name'),
                'Implementation-Version': project.property('mod_version'),
                'Implementation-Vendor' : project.property('mod_authors')
        ])
    }
}
