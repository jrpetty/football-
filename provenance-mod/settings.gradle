pluginManagement {
    repositories {
        mavenCentral()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'provenance'

// The pure-Java rules engine. No Minecraft on its classpath, so it builds and
// tests anywhere with only Maven Central.
include 'core'

// The NeoForge adapter. Needs maven.neoforged.net to resolve Minecraft +
// NeoForge, and produces the shippable mod jar.
include 'neoforge'
