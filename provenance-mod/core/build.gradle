plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    // Gson is already on the Minecraft classpath, so depending on it here costs
    // the shipped jar nothing.
    //
    // The version must match what Minecraft ships. Its dependency graph pins
    // gson with `strictly 2.10.1`, so asking for anything else makes the mod's
    // compile classpath unresolvable rather than simply upgrading it.
    api 'com.google.code.gson:gson:2.10.1'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
