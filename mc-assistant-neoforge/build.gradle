plugins {
    id 'java'
    // ModDevGradle — the official NeoForge toolchain. If this exact version
    // ever fails to resolve, use the latest 2.0.x from
    // https://plugins.gradle.org/plugin/net.neoforged.moddev
    id 'net.neoforged.moddev' version '2.0.78'
}

group = mod_group
// The mod's version follows its build: 0.<build>.0, the build being the newest entry of the changelog at the
// head of AssistantEntity.BUILD_TAG ("2026-07-b266 · ..."). Every change lands with a changelog entry, so every
// change is a new version: in the game's Mods list, in the jar's name and on the release. (gradle.properties'
// mod_version stands in only if the changelog cannot be read.)
ext.modVersion = {
    def src = file('src/main/java/com/jrpetty/mcassistant/entity/AssistantEntity.java')
    if (!src.exists()) return mod_version
    def m = (src.getText('UTF-8') =~ /BUILD_TAG\s*=\s*"\d{4}-\d{2}-b(\d+)/)
    return m.find() ? "0.${m.group(1)}.0".toString() : mod_version
}()
version = modVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // The settlement arithmetic is plain Java on purpose, so the relationships
    // between its numbers can be checked on an ordinary machine rather than
    // taken on trust. `gradlew build` runs these, so a jar is never published
    // with the plots reaching further than the stores can see.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Vosk: offline speech-to-text for the push-to-talk voice control.
    // Embedded in the mod jar via NeoForge's jar-in-jar so users install
    // one file. JNA (vosk's only dependency) already ships with Minecraft.
    jarJar(implementation('com.alphacephei:vosk')) {
        version {
            strictly '[0.3.45,0.4)'
            prefer '0.3.45'
        }
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// ---------------------------------------------------------------------------
// Empirical tests. NOTHING below exists unless -Pgametest is passed, so the
// jar build never sees it: a mistake in this block cannot break a release.
// `./gradlew -Pgametest=true runGameTestServer` boots a real headless server
// with the mod loaded, runs every registered game test, and exits non-zero if
// any of them fail.
// ---------------------------------------------------------------------------
if (project.hasProperty('gametest')) {
    // The tests and their empty structure template live outside src/main, so
    // the jar build never compiles them and never ships them.
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
    neoForge {
        runs {
            gameTestServer {
                type = "gameTestServer"
                systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            }
        }
    }
    tasks.register('printClasspath') {
        doLast { println sourceSets.main.compileClasspath.asPath }
    }
}

// ---------------------------------------------------------------------------
// The client smoke test. `./gradlew -Psmoke=true runSmoke` starts the real game
// client, which joins a dedicated server on localhost and is photographed by
// CI (tools/realworld/smoke.py). Like the game tests, none of this exists
// unless asked for, so a mistake here cannot break a release build.
// ---------------------------------------------------------------------------
if (project.hasProperty('smoke')) {
    neoForge {
        runs {
            smoke {
                client()
                gameDirectory = file('run-client')
                programArguments.addAll('--quickPlayMultiplayer', 'localhost:25565', '--width', '1280', '--height', '720')
            }
        }
    }
}

processResources {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neo_version      : neo_version,
        mod_id           : mod_id,
        mod_version      : modVersion,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
