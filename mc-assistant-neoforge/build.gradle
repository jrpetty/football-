plugins {
    id 'java'
    // ModDevGradle — the official NeoForge toolchain. If this exact version
    // ever fails to resolve, use the latest 2.0.x from
    // https://plugins.gradle.org/plugin/net.neoforged.moddev
    id 'net.neoforged.moddev' version '2.0.78'
}

group = mod_group
// The mod's version follows its build: 0.<build>.0, the build being the newest entry of the changelog at the
// head of AssistantEntity.BUILD_TAG ("2026-07-b266 · ..."). Every change lands with a changelog entry, so every
// change is a new version: in the game's Mods list, in the jar's name and on the release. (gradle.properties'
// mod_version stands in only if the changelog cannot be read.)
ext.modVersion = {
    def src = file('src/main/java/com/jrpetty/mcassistant/entity/AssistantEntity.java')
    if (!src.exists()) return mod_version
    def m = (src.getText('UTF-8') =~ /BUILD_TAG\s*=\s*"\d{4}-\d{2}-b(\d+)/)
    return m.find() ? "0.${m.group(1)}.0".toString() : mod_version
}()
version = modVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // The settlement arithmetic is plain Java on purpose, so the relationships
    // between its numbers can be checked on an ordinary machine rather than
    // taken on trust. `gradlew build` runs these, so a jar is never published
    // with the plots reaching further than the stores can see.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// ---------------------------------------------------------------------------
// Empirical tests. NOTHING below exists unless -Pgametest is passed, so the
// jar build never sees it: a mistake in this block cannot break a release.
// `./gradlew -Pgametest=true runGameTestServer` boots a real headless server
// with the mod loaded, runs every registered game test, and exits non-zero if
// any of them fail.
// ---------------------------------------------------------------------------
if (project.hasProperty('gametest')) {
    // The tests and their empty structure template live outside src/main, so
    // the jar build never compiles them and never ships them.
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
    neoForge {
        runs {
            gameTestServer {
                type = "gameTestServer"
                systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            }
        }
    }
    tasks.register('printClasspath') {
        doLast { println sourceSets.main.compileClasspath.asPath }
    }
}

// ---------------------------------------------------------------------------
// The client smoke test. `./gradlew -Psmoke=true runSmoke` starts the real game
// client, which joins a dedicated server on localhost and is photographed by
// CI (tools/realworld/smoke.py). Like the game tests, none of this exists
// unless asked for, so a mistake here cannot break a release build.
// ---------------------------------------------------------------------------
if (project.hasProperty('smoke')) {
    neoForge {
        runs {
            smoke {
                client()
                gameDirectory = file('run-client')
                programArguments.addAll('--quickPlayMultiplayer', 'localhost:25565', '--width', '1280', '--height', '720')
            }
        }
    }
}

processResources {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neo_version      : neo_version,
        mod_id           : mod_id,
        mod_version      : modVersion,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// ---------------------------------------------------------------------------
// [voice37] The voices inside the release jar. Nothing here runs unless
// -PbundleVoice=true is passed (CI's release build does), so local builds, unit
// tests and game tests stay small and quick. The build downloads every file in
// src/main/resources/assets/mc_assistant/voice/parts.tsv from its pinned source
// (Hugging Face at one revision, GitHub, Maven Central), checks its SHA-256,
// trims what the mod never uses (ONNX Runtime's macOS debug symbols, the Kokoro
// voices nobody can pick), and packs the lot under assets/mc_assistant/voicepack/
// with a manifest of what is in the jar. checkVoiceBundle then opens the jar and
// confirms every file is there at its size. Players' games never go online for a
// voice: the mod unpacks these on first use (PaVoiceAssets).
// ---------------------------------------------------------------------------
if (project.findProperty('bundleVoice') in ['true', true]) {
    def partsFile = file('src/main/resources/assets/mc_assistant/voice/parts.tsv')
    def voiceCache = layout.buildDirectory.dir('voice-cache').get().asFile
    def voiceOut = layout.buildDirectory.dir('voice-assets').get().asFile
    def sha256 = { File f ->
        def md = java.security.MessageDigest.getInstance('SHA-256')
        f.withInputStream { ins -> byte[] buf = new byte[1 << 16]; int n; while ((n = ins.read(buf)) > 0) md.update(buf, 0, n) }
        md.digest().collect { String.format('%02x', it) }.join('')
    }
    def kokoroVoicesKept = ['bm_george', 'bm_lewis', 'bm_daniel', 'bm_fable', 'bf_emma', 'bf_isabella', 'bf_alice', 'bf_lily',
                            'af_heart', 'af_bella', 'am_michael', 'am_adam']   // PaKokoro.CATALOGUE
    def repack = { File from, File to, Closure keep ->
        to.parentFile.mkdirs()
        new java.util.zip.ZipInputStream(new FileInputStream(from)).withCloseable { zin ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(to)).withCloseable { zout ->
                java.util.zip.ZipEntry e
                while ((e = zin.nextEntry) != null) {
                    if (!keep(e.name)) continue
                    def n = new java.util.zip.ZipEntry(e.name)
                    n.time = e.time
                    zout.putNextEntry(n)
                    if (!e.directory) zout << zin
                    zout.closeEntry()
                }
            }
        }
    }
    tasks.register('voiceAssets') {
        description = 'Downloads, checks and packs the bundled voices (-PbundleVoice=true).'
        inputs.file partsFile
        outputs.dir voiceOut
        doLast {
            voiceCache.mkdirs()
            project.delete(voiceOut)
            def manifest = new StringBuilder('# group\tfile\tbytes\tsha256 (as packed in this jar)\n')
            partsFile.eachLine('UTF-8') { line ->
                if (line.isBlank() || line.startsWith('#')) return
                def cols = line.split('\t') as List
                def (group, name, bytes, sha, licence, url) = cols
                def sources = [url] + (cols.size() > 6 && cols[6] ? [cols[6]] : [])   // a mirror of the same file, if the source fails
                long size = bytes as long
                File got = new File(voiceCache, name)
                for (int attempt = 0; attempt < 6 && !(got.exists() && got.length() == size && sha256(got) == sha); attempt++) {
                    if (got.exists() && got.length() >= size) got.delete()             // complete but wrong: start again (perhaps from the mirror)
                    String from = sources[Math.min(sources.size() - 1, attempt.intdiv(3))]
                    long have = got.exists() ? got.length() : 0
                    def c = (HttpURLConnection) new URL(from).openConnection()
                    c.instanceFollowRedirects = true
                    c.setRequestProperty('User-Agent', 'minecraft-mod-build')
                    if (have > 0) c.setRequestProperty('Range', "bytes=${have}-")
                    c.connectTimeout = 30000
                    c.readTimeout = 120000
                    int code
                    try { code = c.responseCode } catch (IOException ex) { logger.warn("voice download failed (${from}): ${ex.message}"); continue }
                    if (code != 200 && code != 206) {
                        logger.warn("HTTP ${code} fetching ${from}")
                        if (sources.size() > 1 && attempt < 3) attempt = 2                // straight to the mirror
                        continue
                    }
                    boolean append = code == 206 && have > 0
                    try {
                        new FileOutputStream(got, append).withCloseable { out -> c.inputStream.withCloseable { ins -> out << ins } }
                    } catch (IOException ex) {
                        logger.warn("voice download interrupted (${name}): ${ex.message}; resuming")
                    }
                }
                if (got.length() != size || sha256(got) != sha) { got.delete(); throw new GradleException("${name} failed its size or SHA-256 check; run the build again") }
                File dest = new File(voiceOut, "assets/mc_assistant/voicepack/${group}/${name}")
                if (name == 'onnxruntime.jar') repack(got, dest) { String n -> !n.contains('.dSYM/') }
                // [voice42] the Intel Mac runtime (1.23.2): its classes and only the osx-x64 library, the rest is in onnxruntime.jar
                else if (name == 'onnxruntime-macx64.jar') repack(got, dest) { String n -> !n.contains('.dSYM/') && (!n.startsWith('ai/onnxruntime/native/') || n == 'ai/onnxruntime/native/' || n.startsWith('ai/onnxruntime/native/osx-x64/')) }
                else if (name == 'voices-v1.0.bin') repack(got, dest) { String n -> kokoroVoicesKept.contains(n.replace('.npy', '')) }
                else { dest.parentFile.mkdirs(); java.nio.file.Files.copy(got.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING) }
                manifest.append("${group}\t${name}\t${dest.length()}\t${sha256(dest)}\n")
                logger.lifecycle("voice: ${group}/${name} ${(dest.length() / 1000000) as long} MB (${licence})")
            }
            def m = new File(voiceOut, 'assets/mc_assistant/voicepack/manifest.tsv')
            m.parentFile.mkdirs()
            m.setText(manifest.toString(), 'UTF-8')
        }
    }
    tasks.named('jar') {
        dependsOn 'voiceAssets'
        from(voiceOut)
    }
    tasks.register('checkVoiceBundle') {
        description = 'Opens the release jar and confirms every bundled voice file is in it at its size.'
        dependsOn 'jar'
        doLast {
            File jarFile = tasks.named('jar').get().archiveFile.get().asFile
            new java.util.zip.ZipFile(jarFile).withCloseable { z ->
                def me = z.getEntry('assets/mc_assistant/voicepack/manifest.tsv')
                if (me == null) throw new GradleException('the jar has no voice manifest')
                int n = 0
                z.getInputStream(me).getText('UTF-8').eachLine { line ->
                    if (line.isBlank() || line.startsWith('#')) return
                    def f = line.split('\t')
                    def e = z.getEntry("assets/mc_assistant/voicepack/${f[0]}/${f[1]}")
                    if (e == null || e.size != (f[2] as long)) throw new GradleException("voice file missing or the wrong size in the jar: ${f[0]}/${f[1]}")
                    n++
                }
                if (n < 17) throw new GradleException("only ${n} voice files in the jar")
                ['kokoro', 'expressive', 'stt'].each { g ->
                    if (!z.getInputStream(me).getText('UTF-8').readLines().any { it.startsWith(g + '\t') }) throw new GradleException("no ${g} files in the jar")
                }
                if (jarFile.length() >= 2_000_000_000L) throw new GradleException("the jar is ${jarFile.length()} bytes: over GitHub's 2 GB asset limit")
                logger.lifecycle("voice bundle: ${n} files, jar ${(jarFile.length() / 1000000) as long} MB")
            }
        }
    }
    tasks.named('assemble') { dependsOn 'checkVoiceBundle' }
}
