id: own_pos
label: "Our own point of sale - ground truth"
channel: own_retail_b2c
currency: GBP
observation_type: sold
trust: 1.00
file_glob: "own_pos_*.csv"

price:
  vat_treatment: inclusive
  fees: {rate: 0.015, fixed: 0.0}      # card processing only

columns:
  raw_title: "description"
  price_gross: "gross_price"
  sold_at: "invoice_date"
  grade_raw: "grade"
  serial: "serial"

date_format: "%Y-%m-%d"
grade_map: {A+: A_PLUS, A: A, B: B, C: C, D: D}
exclude_if:
  - price_gross_below: 20
