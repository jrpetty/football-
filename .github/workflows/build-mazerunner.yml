name: Build Maze Runner mod

on:
  workflow_dispatch:
  push:
    branches: [claude/maze-runner-gamemode-map-4gzuak]
    paths:
      - 'mazerunner-neoforge/**'
      - '!mazerunner-neoforge/dist/**'
      - '.github/workflows/build-mazerunner.yml'

permissions:
  contents: write

concurrency:
  group: build-mazerunner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mazerunner-neoforge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pin latest stable NeoForge 21.1.x
        run: |
          set -e
          latest=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
            | grep -oE '<version>21\.1\.[0-9]+</version>' \
            | sed -E 's/<\/?version>//g' | sort -t. -k3 -n | tail -1 || true)
          if [ -n "$latest" ]; then
            sed -i "s/^neoforge_version=.*/neoforge_version=$latest/" gradle.properties
            echo "Using NeoForge $latest"
          else
            echo "Metadata fetch failed — using pinned $(grep neoforge_version gradle.properties)"
          fi

      - name: Build and run unit tests
        run: ./gradlew --no-daemon build

      - name: Summarise unit tests
        if: always()
        run: |
          set -e
          shopt -s nullglob
          results=(build/test-results/test/TEST-*.xml)
          if [ ${#results[@]} -eq 0 ]; then
            echo "::error::No unit test results were produced — the test suite did not run."
            exit 1
          fi
          total=0; failed=0; errored=0; skipped=0
          for f in "${results[@]}"; do
            t=$(sed -n 's/.*<testsuite[^>]* tests="\([0-9]*\)".*/\1/p' "$f" | head -1)
            fl=$(sed -n 's/.*<testsuite[^>]* failures="\([0-9]*\)".*/\1/p' "$f" | head -1)
            er=$(sed -n 's/.*<testsuite[^>]* errors="\([0-9]*\)".*/\1/p' "$f" | head -1)
            sk=$(sed -n 's/.*<testsuite[^>]* skipped="\([0-9]*\)".*/\1/p' "$f" | head -1)
            total=$((total + ${t:-0})); failed=$((failed + ${fl:-0}))
            errored=$((errored + ${er:-0})); skipped=$((skipped + ${sk:-0}))
          done
          echo "### Unit tests: $total run, $failed failed, $errored errored, $skipped skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Unit tests: $total run, $failed failed, $errored errored, $skipped skipped"
          if [ "$total" -lt 30 ]; then
            echo "::error::Only $total tests ran — expected the full suite."
            exit 1
          fi
          [ "$failed" -eq 0 ] && [ "$errored" -eq 0 ]

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: mazerunner-neoforge/build/reports/tests/test

      - name: Verify jar contents
        run: |
          jar tf build/libs/mazerunner-*.jar | tee /tmp/contents.txt
          grep -q 'com/jrpetty/mazerunner/MazeRunnerMod.class' /tmp/contents.txt
          grep -q 'com/jrpetty/mazerunner/GrieverEntity.class' /tmp/contents.txt
          grep -q 'com/jrpetty/mazerunner/ModEntities.class' /tmp/contents.txt
          grep -q 'com/jrpetty/mazerunner/config/MazeClock.class' /tmp/contents.txt
          grep -q 'com/jrpetty/mazerunner/config/TreeShape.class' /tmp/contents.txt
          grep -q 'com/jrpetty/mazerunner/GrieverSerumItem.class' /tmp/contents.txt
          grep -q 'com/jrpetty/mazerunner/ModItems.class' /tmp/contents.txt
          grep -q 'com/jrpetty/mazerunner/config/GrieverAudio.class' /tmp/contents.txt
          grep -q 'assets/mazerunner/models/item/griever_serum.json' /tmp/contents.txt
          grep -q 'META-INF/neoforge.mods.toml' /tmp/contents.txt
          grep -q 'data/mazerunner/maze/maze_config_v2.json' /tmp/contents.txt
          grep -q 'data/mazerunner/worldgen/world_preset/maze_runner.json' /tmp/contents.txt
          # the jar must ship mod code only — no test classes
          ! grep -q 'Test.class' /tmp/contents.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mazerunner-jar
          path: mazerunner-neoforge/build/libs/mazerunner-*.jar

      - name: Commit jar back to the branch
        run: |
          mkdir -p dist && rm -f dist/*.jar
          cp build/libs/mazerunner-*.jar dist/
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f mazerunner-neoforge/dist  # root .gitignore ignores dist/ (Vite); force past it
          git diff --cached --quiet || git commit -m "CI: add built Maze Runner jar [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
