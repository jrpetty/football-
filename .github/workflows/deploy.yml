name: Deploy to GitHub Pages

# Builds both apps and publishes ./dist to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# After that, every push to this branch (or main) redeploys automatically.
#
# Only the default branch publishes. There is one Pages site, so a second
# branch listed here would overwrite whatever the default branch last
# published — and with the predictor updating its data daily, that would mean
# a stray feature-branch push silently rolling the site back to older
# forecasts. Use workflow_dispatch to preview a branch instead.

on:
  push:
    branches:
      - main
      - claude/football-analysis-app-jj3vxi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with the predictor's daily publish so the two queue rather than race.
# Never cancel: the other holder of this group is a data publish, and killing
# it would leave the site showing forecasts the repository has already moved
# past, with nothing to retry it until the next morning.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gaffer (the coaching app) is published at the site root.
      - run: npm ci
      - run: npm run build

      # The Premier League predictor is a separate app published under
      # /predictor/. Its vite base is relative, so it works from a sub-path.
      - name: Build the predictor
        working-directory: predictor
        run: |
          npm ci
          npm run build
      - name: Place the predictor under /predictor
        run: |
          mkdir -p dist/predictor
          cp -r predictor/dist/. dist/predictor/

      # Provisions the Pages site on first use. Without this the deploy below
      # 404s until someone flips Settings -> Pages -> Source: "GitHub Actions"
      # by hand, and the only symptom is a red job with a message that reads
      # like a bug in this workflow rather than a missing one-time setting.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
