name: Deploy to GitHub Pages

# Builds all three apps and publishes ./dist to GitHub Pages.
#
# ONE-TIME SETUP, still outstanding: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Until somebody does that, every deploy here fails
# with "Failed to create deployment (status: 404) ... Ensure GitHub Pages has
# been enabled" and nothing is published at all. Enabling it from a workflow
# was tried and is refused by policy — see the note further down.
#
# EACH APP IS BUILT FROM THE BRANCH THAT OWNS IT, whichever branch this run was
# started by. There is one Pages site and a publish replaces all of it, so the
# earlier rule — only the default branch publishes — was really a way of saying
# "a feature branch would roll the other apps back to whatever it happened to
# have". Checking each app out from its own branch says that directly and
# removes the reason, so Tally can publish from its own branch without taking
# the predictor's forecasts backwards with it.

on:
  push:
    branches:
      - main
      - claude/football-analysis-app-jj3vxi
      - claude/pub-till-reconciliation-2vr6y6
  workflow_dispatch:

env:
  # The branch each app is published from. Changing one of these is how an app
  # moves; nothing else in this file names a branch.
  GAFFER_BRANCH: claude/football-analysis-app-jj3vxi
  PREDICTOR_BRANCH: claude/football-analysis-app-jj3vxi
  TALLY_BRANCH: claude/pub-till-reconciliation-2vr6y6

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with the predictor's daily publish so the two queue rather than race.
# Never cancel: the other holder of this group is a data publish, and killing
# it would leave the site showing forecasts the repository has already moved
# past, with nothing to retry it until the next morning.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Gaffer at the site root, from its own branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.GAFFER_BRANCH }}
      # And the other two alongside it, each from the branch that owns it, so
      # a publish started by any of them carries all three at their newest.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PREDICTOR_BRANCH }}
          path: .from-predictor
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TALLY_BRANCH }}
          path: .from-tally
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gaffer (the coaching app) is published at the site root.
      - run: npm ci
      - run: npm run build

      # The Premier League predictor is a separate app published under
      # /predictor/. Its vite base is relative, so it works from a sub-path.
      - name: Build the predictor
        working-directory: .from-predictor/predictor
        run: |
          npm ci
          npm run build
      - name: Place the predictor under /predictor
        run: |
          mkdir -p dist/predictor
          cp -r .from-predictor/predictor/dist/. dist/predictor/

      # Tally, the pub till reconciliation app, is published under /tally/.
      # Its vite base is relative for the same reason the predictor's is, so it
      # works from a sub-path — and, because it is installed to a phone's home
      # screen, that sub-path is also its permanent address. Moving it later
      # would orphan every installed copy.
      - name: Build Tally
        working-directory: .from-tally/tally
        run: |
          npm ci
          npm run build
      - name: Place Tally under /tally
        run: |
          mkdir -p dist/tally
          cp -r .from-tally/tally/dist/. dist/tally/

      - name: Say what went up
        run: |
          {
            echo "### Published"
            echo "- Gaffer at \`/\` from \`$GAFFER_BRANCH\`"
            echo "- Predictor at \`/predictor/\` from \`$PREDICTOR_BRANCH\`"
            echo "- Tally at \`/tally/\` from \`$TALLY_BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: actions/configure-pages with enablement: true was tried here and
      # cannot work on this repository — GITHUB_TOKEN gets "Resource not
      # accessible by integration" from the create-Pages-site API, which is an
      # app-permission policy no workflow can talk its way around. It also made
      # things worse: it failed two steps earlier with an error that reads like
      # a permissions bug. actions/deploy-pages below fails with the far more
      # useful "Ensure GitHub Pages has been enabled" and a link straight to
      # the settings page, so the site has to be switched on by a human once:
      # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
