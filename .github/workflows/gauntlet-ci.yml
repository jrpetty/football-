name: Gauntlet CI

# Validates the benchmark library and runs the harness test-suite whenever
# anything under gauntlet/ changes. Makes no model API calls.
on:
  push:
    paths:
      - 'gauntlet/**'
      - '.github/workflows/gauntlet-ci.yml'
  pull_request:
    paths:
      - 'gauntlet/**'
      - '.github/workflows/gauntlet-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gauntlet
    env:
      GAUNTLET_NO_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gauntlet/package-lock.json
      - run: npm ci
      - run: node src/cli.ts validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:ui
