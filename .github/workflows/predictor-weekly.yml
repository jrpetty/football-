# Weekly re-check for the Premier League predictor.
#
# Two runs a week, each with a different job:
#   Tuesday  — the weekend is done. Ingest results, score the forecasts that
#              were recorded before kickoff, refit ratings, publish the next
#              gameweek.
#   Friday   — team news has landed. Refresh availability and republish before
#              the matches start.
#
# Committing the artifacts is what triggers a Pages redeploy, so the site
# updates itself without anyone touching it.

name: Predictor weekly update

on:
  schedule:
    # Times are UTC. Tuesday 06:00 and Friday 06:00.
    - cron: '0 6 * * 2'
    - cron: '0 6 * * 5'
  workflow_dispatch:
    inputs:
      source:
        description: 'Data source: auto (live with mirror fallback), live, or mirror'
        required: false
        default: 'auto'
        type: choice
        options: [auto, live, mirror]

# Never let two updates race for the same commit.
concurrency:
  group: predictor-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 runs the pipeline's TypeScript directly, so there is no
          # build step and no extra dependency to install for it.
          node-version: 22
          cache: npm
          cache-dependency-path: predictor/package-lock.json

      - name: Install
        working-directory: predictor
        run: npm ci

      - name: Check the model still passes its own tests
        working-directory: predictor
        # A bad refactor should stop the pipeline before it publishes numbers,
        # not after.
        run: npm test

      - name: Ingest data and rebuild predictions
        working-directory: predictor
        run: |
          node scripts/ingest.ts --source "${{ inputs.source || 'auto' }}"
          node scripts/build-all.ts

      - name: Verify the artifacts before publishing
        working-directory: predictor
        run: node scripts/verify-artifacts.ts

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- predictor/public/data; then
            echo "No change in the artifacts — nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictor/public/data
          SUMMARY=$(node -e "
            const s = require('./predictor/public/data/season.json');
            const a = require('./predictor/public/data/accuracy.json');
            const scored = a.overall.n;
            process.stdout.write(
              'gameweek ' + s.currentGameweek +
              (scored ? ', ' + scored + ' scored, RPS ' + a.overall.rps.toFixed(4) : ', no results yet')
            );
          ")
          git commit -m "Update predictions ($SUMMARY)"
          git push
