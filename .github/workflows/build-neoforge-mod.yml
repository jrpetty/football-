name: Build NeoForge mod jar

# Compiles mc-assistant-neoforge and publishes the jar two ways:
#  - as a run artifact (Actions tab -> this run -> Artifacts)
#  - attached to the rolling "neoforge-mod-latest" release (Releases page)

on:
  push:
    branches:
      - claude/minecraft-ai-assistant-44hj4f
      - main
    paths:
      - "mc-assistant-neoforge/**"
      - ".github/workflows/build-neoforge-mod.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neoforge-mod-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build mod
        working-directory: mc-assistant-neoforge
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: List outputs
        working-directory: mc-assistant-neoforge
        run: ls -la build/libs/

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-assistant-neoforge-jar
          path: mc-assistant-neoforge/build/libs/*.jar
          if-no-files-found: error

      - name: Attach jar to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neoforge-mod-latest
          name: "MC Assistant — NeoForge mod (latest build)"
          body: |
            Compiled mod jar for **Minecraft 1.21.1 / NeoForge 21.1**.
            Drop it into your `mods/` folder (client for single player;
            server + client for multiplayer). Everything is obtainable in
            SURVIVAL. A hired assistant: craft an Assistant Spawner (8 rotten
            flesh around a diamond) and PLACE it. A self-running village:
            craft a Village Folk Spawner (8 bread around a gold ingot) and
            PLACE it — the first founds the village, each one after adds a
            settler — or use `/village spawn 12` and `/village status`.
            Villages also generate on their own as you explore. Talk to an
            assistant in chat: `!follow`, `!guard`, `!gather logs 16`.
          files: mc-assistant-neoforge/build/libs/*.jar

  # -------------------------------------------------------------------------
  # Village behaviour tests. Runs in parallel with the build and can never
  # fail it: this is where the mod is actually RUN, on a real headless
  # server, rather than only compiled. Output is published to a separate
  # release so it can be read back without digging through logs.
  # -------------------------------------------------------------------------
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Probe the real GameTest API
        working-directory: mc-assistant-neoforge
        run: |
          chmod +x gradlew
          # compileJava first: it is what MATERIALISES the Minecraft/NeoForge
          # jars on disk, and printClasspath only lists paths.
          ./gradlew --no-daemon -q -Pgametest=true compileJava printClasspath > cp.raw 2> cp.err || true
          CP=$(tail -1 cp.raw)
          {
            echo "### classpath entries: $(echo "$CP" | tr ':' '\n' | wc -l)"
            echo "### the ones that exist and look like Minecraft/NeoForge:"
            for j in $(echo "$CP" | tr ':' ' '); do
              if [ -e "$j" ]; then echo "  EXISTS $(du -h "$j" | cut -f1) $j"; else echo "  MISSING $j"; fi
            done | grep -iE 'neoforge|minecraft|neoform|MISSING' | head -40
            echo "### gametest-ish classes on the classpath"
            for j in $(echo "$CP" | tr ':' ' '); do
              unzip -l "$j" 2>/dev/null | awk '{print $4}' | grep -iE 'gametest' | sed "s|^|$(basename "$j"): |"
            done | sort -u | head -300
            for c in net.neoforged.neoforge.event.RegisterGameTestsEvent \
                     net.minecraft.gametest.framework.GameTest \
                     net.minecraft.gametest.framework.GameTestHelper \
                     net.minecraft.gametest.framework.GameTestServer \
                     net.minecraft.gametest.framework.GameTestInfo \
                     net.minecraft.server.ServerTickRateManager; do
              echo; echo "##### javap $c"
              javap -cp "$CP" -p "$c" 2>&1 | grep -v '^Picked up'
            done
            for c in $(for j in $(echo "$CP" | tr ':' ' '); do unzip -l "$j" 2>/dev/null | awk '{print $4}' | grep -E '^net/neoforged/neoforge/gametest/.*\.class$'; done | sort -u | sed 's|/|.|g; s|\.class$||' | head -30); do
              echo; echo "##### javap $c"
              javap -cp "$CP" -p "$c" 2>&1 | grep -v '^Picked up'
            done
            echo; echo "##### ServerLevel entity iteration"
            javap -cp "$CP" -p net.minecraft.server.level.ServerLevel 2>&1 | grep -E 'getAllEntities|getEntities|getEntity\(' 
          } > probe.txt 2>&1
          wc -l probe.txt
          cat cp.err | tail -5

      - name: Publish probe
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: village-test-latest
          name: "Village behaviour test output (latest)"
          prerelease: true
          make_latest: "false"
          body: "Raw output of the empirical village tests. Not a mod build."
          files: |
            mc-assistant-neoforge/probe.txt
          overwrite_files: true
