name: Build NeoForge mod jar

# Compiles mc-assistant-neoforge and publishes the jar two ways:
#  - as a run artifact (Actions tab -> this run -> Artifacts)
#  - attached to the rolling "neoforge-mod-latest" release (Releases page)

on:
  push:
    branches:
      - claude/minecraft-ai-assistant-44hj4f
      - main
    paths:
      - "mc-assistant-neoforge/**"
      - ".github/workflows/build-neoforge-mod.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neoforge-mod-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build mod
        working-directory: mc-assistant-neoforge
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: List outputs
        working-directory: mc-assistant-neoforge
        run: ls -la build/libs/

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-assistant-neoforge-jar
          path: mc-assistant-neoforge/build/libs/*.jar
          if-no-files-found: error

      - name: Attach jar to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neoforge-mod-latest
          name: "MC Assistant — NeoForge mod (latest build)"
          body: |
            Compiled mod jar for **Minecraft 1.21.1 / NeoForge 21.1**.
            Drop it into your `mods/` folder (client for single player;
            server + client for multiplayer). Everything is obtainable in
            SURVIVAL. A hired assistant: craft an Assistant Spawner (8 rotten
            flesh around a diamond) and PLACE it. A self-running village:
            craft a Village Folk Spawner (8 bread around a gold ingot) and
            PLACE it — the first founds the village, each one after adds a
            settler — or use `/village spawn 12` and `/village status`.
            Villages also generate on their own as you explore. Talk to an
            assistant in chat: `!follow`, `!guard`, `!gather logs 16`.
          files: mc-assistant-neoforge/build/libs/*.jar

  # -------------------------------------------------------------------------
  # Village behaviour tests. Runs in parallel with the build and can never
  # fail it: this is where the mod is actually RUN, on a real headless
  # server, rather than only compiled. Output is published to a separate
  # release so it can be read back without digging through logs.
  # -------------------------------------------------------------------------
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run the village on a real headless server
        working-directory: mc-assistant-neoforge
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon -Pgametest=true runGameTestServer 2>&1 | tee gametest.log
          echo "gradle exit: ${PIPESTATUS[0]}"
          set -e
          # The part worth reading: our own reporting, the framework's verdicts,
          # and any crash — without the thousands of lines of engine start-up.
          grep -aE "\[VT\]|GAME TEST|Game Test|game test|required|FAILED|Exception|Caused by|^\s+at com\.jrpetty|Crash|crash report|ERROR|Test '|test '|batch|Batch" gametest.log > vt-report.txt || true
          wc -l gametest.log vt-report.txt
          gzip -k -f gametest.log

      - name: Publish the report
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: village-test-latest
          name: "Village behaviour test output (latest)"
          prerelease: true
          make_latest: "false"
          body: "Raw output of the empirical village tests. Not a mod build."
          files: |
            mc-assistant-neoforge/vt-report.txt
            mc-assistant-neoforge/gametest.log.gz
          overwrite_files: true

  # -------------------------------------------------------------------------
  # The same village on REAL terrain. The game tests build their own ground, so
  # they cannot say anything about hills, rivers, slopes or forests as the game
  # generates them. This starts a genuine dedicated server (vanilla world
  # generation, the mod loaded), settles twelve folk in a chosen biome over
  # RCON, lets three game days pass at full speed, and reports what they did.
  # One scenario per runner; the "takeover" scenario instead generates a
  # vanilla village and checks its villagers become folk without freezing the
  # server. Like the game tests it can never fail the build.
  # -------------------------------------------------------------------------
  realworld:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        scenario: [plains, forest, taiga, savanna, takeover]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare a server directory
        working-directory: mc-assistant-neoforge
        run: |
          mkdir -p run/config
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'EOF'
          level-seed=7331
          level-type=minecraft:normal
          generate-structures=true
          online-mode=false
          spawn-protection=0
          max-tick-time=-1
          view-distance=6
          simulation-distance=6
          sync-chunk-writes=false
          enable-rcon=true
          rcon.port=25575
          rcon.password=soak
          broadcast-rcon-to-ops=false
          motd=soak
          EOF
          # The scenario places its own village; keep the world's natural ones
          # from crowding the measurement.
          cat > run/config/mc_assistant-common.toml <<'EOF'
          [villages]
          naturalVillages = false
          EOF

      - name: Start the server
        working-directory: mc-assistant-neoforge
        run: |
          chmod +x gradlew
          nohup ./gradlew --no-daemon runServer > server-gradle.log 2>&1 &

      - name: Settle a village and let three days pass
        working-directory: mc-assistant-neoforge
        run: |
          set +e
          python3 tools/realworld/soak.py "${{ matrix.scenario }}" | tee real-${{ matrix.scenario }}.txt
          echo "soak exit: ${PIPESTATUS[0]}"
          set -e
          sleep 5
          # Whatever the server complained about while it ran.
          echo "[REAL] ---- server log: warnings and errors from the mod ----" >> real-${{ matrix.scenario }}.txt
          grep -aE "Exception|Caused by|ERROR|mc_assistant|com\.jrpetty" run/logs/latest.log | grep -av "Ambiguity\|Advanced terminal" | tail -150 >> real-${{ matrix.scenario }}.txt || true
          gzip -c run/logs/latest.log > server-${{ matrix.scenario }}.log.gz || true
          wc -l real-${{ matrix.scenario }}.txt

      - name: Stop the server
        if: always()
        run: pkill -f "net.minecraft" || true; pkill -f "runServer" || true

      - name: Publish the report
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: village-test-latest
          name: "Village behaviour test output (latest)"
          prerelease: true
          make_latest: "false"
          body: "Raw output of the empirical village tests. Not a mod build."
          files: |
            mc-assistant-neoforge/real-${{ matrix.scenario }}.txt
            mc-assistant-neoforge/server-${{ matrix.scenario }}.log.gz
          overwrite_files: true

