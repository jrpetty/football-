name: Build NeoForge mod jar

# Compiles mc-assistant-neoforge and publishes the jar two ways:
#  - as a run artifact (Actions tab -> this run -> Artifacts)
#  - attached to the rolling "neoforge-mod-latest" release (Releases page)

on:
  push:
    branches:
      - claude/minecraft-ai-assistant-44hj4f
      - main
    paths:
      - "mc-assistant-neoforge/**"
      - ".github/workflows/build-neoforge-mod.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neoforge-mod-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build mod
        working-directory: mc-assistant-neoforge
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: List outputs
        working-directory: mc-assistant-neoforge
        run: ls -la build/libs/

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-assistant-neoforge-jar
          path: mc-assistant-neoforge/build/libs/*.jar
          if-no-files-found: error

      - name: Attach jar to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neoforge-mod-latest
          name: "MC Assistant — NeoForge mod (latest build)"
          body: |
            Compiled mod jar for **Minecraft 1.21.1 / NeoForge 21.1**.
            Drop it into your `mods/` folder (client for single player;
            server + client for multiplayer). Everything is obtainable in
            SURVIVAL. A hired assistant: craft an Assistant Spawner (8 rotten
            flesh around a diamond) and PLACE it. A self-running village:
            craft a Village Folk Spawner (8 bread around a gold ingot) and
            PLACE it — the first founds the village, each one after adds a
            settler — or use `/village spawn 12` and `/village status`.
            Villages also generate on their own as you explore. Talk to an
            assistant in chat: `!follow`, `!guard`, `!gather logs 16`.
          files: mc-assistant-neoforge/build/libs/*.jar

      # Each build is a version of its own (0.<build>.0, its jar named for it): the release keeps this one's jar
      # and lets the older ones go, so the download is never a choice between versions.
      - name: Keep only this version's jar on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep=$(cd mc-assistant-neoforge/build/libs && ls *.jar | grep -v -e '-sources' -e '-javadoc' | head -1)
          echo "this build's jar: $keep"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          rel=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/releases/tags/neoforge-mod-latest")
          echo "$rel" | jq -r '.assets[] | select(.name | endswith(".jar")) | "\(.id) \(.name)"' | while read -r id name; do
            if [ "$name" != "$keep" ]; then
              echo "removing the older $name"
              curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/releases/assets/$id" || true
            fi
          done

  # -------------------------------------------------------------------------
  # Village behaviour tests. Runs in parallel with the build and can never
  # fail it: this is where the mod is actually RUN, on a real headless
  # server, rather than only compiled. Output is published to a separate
  # release so it can be read back without digging through logs.
  # -------------------------------------------------------------------------
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # some 1,200 game tests now; 0.292.0 ran out at 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run the village on a real headless server
        working-directory: mc-assistant-neoforge
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon -Pgametest=true runGameTestServer 2>&1 | tee gametest.log
          echo "gradle exit: ${PIPESTATUS[0]}"
          set -e
          # The part worth reading: our own reporting, the framework's verdicts,
          # and any crash — without the thousands of lines of engine start-up.
          grep -aE "\[VT\]|GAME TEST|Game Test|game test|required|FAILED|Exception|Caused by|^\s+at com\.jrpetty|Crash|crash report|ERROR|Test '|test '|batch|Batch" gametest.log > vt-report.txt || true
          wc -l gametest.log vt-report.txt
          gzip -k -f gametest.log

      - name: Publish the report
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: village-test-latest
          name: "Village behaviour test output (latest)"
          prerelease: true
          make_latest: "false"
          body: "Raw output of the empirical village tests. Not a mod build."
          files: |
            mc-assistant-neoforge/vt-report.txt
            mc-assistant-neoforge/gametest.log.gz
          overwrite_files: true

  # -------------------------------------------------------------------------
  # The same village on REAL terrain. The game tests build their own ground, so
  # they cannot say anything about hills, rivers, slopes or forests as the game
  # generates them. This starts a genuine dedicated server (vanilla world
  # generation, the mod loaded), settles twelve folk in a chosen biome over
  # RCON, lets three game days pass at full speed, and reports what they did.
  # One scenario per runner; the "takeover" scenario instead generates a
  # vanilla village and checks its villagers become folk without freezing the
  # server (with replaceVillagers turned on for it: the takeover is off by
  # default, folk and villagers kept apart), and "natural" checks that a vanilla
  # village's villagers stay villagers. Like the game tests it can never fail the build.
  # -------------------------------------------------------------------------
  realworld:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true
    strategy:
      fail-fast: false
      # Four at a time: eleven at once, with the game tests, the client and a long run going, left the
      # game tests and the client waiting for a hosted runner until they were given up.
      max-parallel: 4
      matrix:
        scenario: [plains, forest, taiga, savanna, takeover, crowd, natural, restart, pair, twin, modpack]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare a server directory
        working-directory: mc-assistant-neoforge
        run: |
          mkdir -p run/config
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'EOF'
          level-seed=7331
          level-type=minecraft:normal
          generate-structures=true
          online-mode=false
          spawn-protection=0
          max-tick-time=-1
          view-distance=6
          simulation-distance=6
          sync-chunk-writes=false
          enable-rcon=true
          rcon.port=25575
          rcon.password=soak
          broadcast-rcon-to-ops=false
          motd=soak
          EOF
          # The scenario places its own village; keep the world's natural ones
          # from crowding the measurement.
          # Every scenario places its own village, so the world's natural ones would
          # only crowd the measurement — except the one that is about them.
          if [ "${{ matrix.scenario }}" = "natural" ]; then NATURAL=true; else NATURAL=false; fi
          # The old takeover is off by default (folk and villagers are two peoples, kept apart): the
          # takeover scenario turns it on, so that path stays tested; every other keeps villagers villagers
          # (and "natural" checks that they do).
          if [ "${{ matrix.scenario }}" = "takeover" ]; then REPLACE=true; else REPLACE=false; fi
          cat > run/config/mc_assistant-common.toml <<EOF
          [villages]
          naturalVillages = ${NATURAL}
          replaceVillagers = ${REPLACE}
          EOF
          # The modpack scenario: the mod among two of the most common others (JEI and Jade),
          # the newest NeoForge 1.21.1 build of each from Modrinth.
          if [ "${{ matrix.scenario }}" = "modpack" ]; then
            mkdir -p run/mods
            # The newest release of each that loads on this project's NeoForge.
            python3 tools/realworld/fetch_mods.py jei jade | tee modpack-choice.txt
            ls -la run/mods
          fi

      - name: Start the server
        working-directory: mc-assistant-neoforge
        run: |
          chmod +x gradlew
          nohup ./gradlew --no-daemon runServer > server-gradle.log 2>&1 &

      - name: Settle a village and let three days pass
        working-directory: mc-assistant-neoforge
        run: |
          set +e
          FIRST="${{ matrix.scenario }}"
          # "restart" is two runs of one world: found and save, then start again.
          if [ "$FIRST" = "restart" ]; then FIRST=restart1; fi
          # The plains town is photographed afterwards: the server is left running for it.
          if [ "${{ matrix.scenario }}" = "plains" ]; then export SOAK_KEEP=1; fi
          python3 tools/realworld/soak.py "$FIRST" | tee real-${{ matrix.scenario }}.txt
          echo "soak exit: ${PIPESTATUS[0]}"
          set -e
          sleep 5

      # The town the folk made in those three days, in pictures: a real client on a virtual
      # display joins the same server, and the player goes over it as a camera (photo.py).
      - name: Photograph the town the folk made
        if: matrix.scenario == 'plains'
        working-directory: mc-assistant-neoforge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libxrandr2 libxxf86vm1 libxi6 libxcursor1 libxinerama1 imagemagick
          mkdir -p run-client
          cat > run-client/options.txt <<'OPTS'
          onboardAccessibility:false
          tutorialStep:none
          pauseOnLostFocus:false
          narrator:0
          fancyGraphics:true
          renderDistance:8
          simulationDistance:6
          maxFps:30
          guiScale:2
          hideGui:true
          joinedFirstServer:true
          skipMultiplayerWarning:true
          OPTS
          nohup Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset > xvfb.log 2>&1 &
          sleep 3
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          nohup ./gradlew --no-daemon -Psmoke=true runSmoke > client-gradle.log 2>&1 &
          set +e
          python3 tools/realworld/photo.py village-spot.txt plains- | tee -a real-plains.txt
          set -e
          ls -la smoke-plains-*.png || true

      - name: Start the same world again and see what came back
        if: matrix.scenario == 'restart'
        working-directory: mc-assistant-neoforge
        run: |
          # Wait for the first server to finish saving and exit.
          for i in $(seq 1 90); do pgrep -f "runServer" > /dev/null || break; sleep 2; done
          sleep 3
          cp run/logs/latest.log first-run.log || true
          nohup ./gradlew --no-daemon runServer > server-gradle2.log 2>&1 &
          set +e
          python3 tools/realworld/soak.py restart2 | tee -a real-restart.txt
          echo "soak exit: ${PIPESTATUS[0]}"
          set -e
          sleep 5

      - name: Collect the server log
        if: always()
        working-directory: mc-assistant-neoforge
        run: |
          # Whatever the server complained about while it ran (both runs, for the
          # restart scenario).
          echo "[REAL] ---- server log: warnings and errors from the mod ----" >> real-${{ matrix.scenario }}.txt
          cat first-run.log run/logs/latest.log 2>/dev/null | grep -aE "Exception|Caused by|ERROR|mc_assistant|com\.jrpetty" | grep -av "Ambiguity\|Advanced terminal\|^    at " | tail -150 >> real-${{ matrix.scenario }}.txt || true
          # Every time the server stood still for more than a second and a half, and
          # what it was doing (the stack), plus how the chunk queue was getting on.
          echo "[REAL] ---- stalls (the server thread's stack when a tick took over 1.5 s) ----" >> real-${{ matrix.scenario }}.txt
          cat first-run.log run/logs/latest.log 2>/dev/null | grep -a -A 42 "MCA-STALL" | head -700 >> real-${{ matrix.scenario }}.txt || true
          echo "[REAL] ---- mods loaded, and slow villages ----" >> real-${{ matrix.scenario }}.txt
          cat modpack-choice.txt >> real-${{ matrix.scenario }}.txt 2>/dev/null || true
          cat first-run.log run/logs/latest.log 2>/dev/null | grep -aiE "Found mod file|Loading [0-9]+ mods|mod.*jei|mod.*jade" | head -20 >> real-${{ matrix.scenario }}.txt || true
          cat first-run.log run/logs/latest.log 2>/dev/null | grep -a "MCA-SLOW" | tail -40 >> real-${{ matrix.scenario }}.txt || true
          echo "[REAL] ---- why the village was or was not building ----" >> real-${{ matrix.scenario }}.txt
          cat first-run.log run/logs/latest.log 2>/dev/null | grep -a "MCA-BUILD" | head -150 >> real-${{ matrix.scenario }}.txt || true
          echo "[REAL] ---- chunk queue ----" >> real-${{ matrix.scenario }}.txt
          cat first-run.log run/logs/latest.log 2>/dev/null | grep -a "MCA-CHUNKS" | head -60 >> real-${{ matrix.scenario }}.txt || true
          cat first-run.log run/logs/latest.log 2>/dev/null | gzip -c > server-${{ matrix.scenario }}.log.gz || true
          wc -l real-${{ matrix.scenario }}.txt

      - name: Stop the server
        if: always()
        run: pkill -f "net.minecraft" || true; pkill -f "runServer" || true; pkill -f "runSmoke" || true; pkill Xvfb || true

      - name: Publish the report
        if: always()
        continue-on-error: true   # a picture lost to an upload race is not a failed town
        uses: softprops/action-gh-release@v2
        with:
          tag_name: village-test-latest
          name: "Village behaviour test output (latest)"
          prerelease: true
          make_latest: "false"
          body: "Raw output of the empirical village tests. Not a mod build."
          files: |
            mc-assistant-neoforge/real-${{ matrix.scenario }}.txt
            mc-assistant-neoforge/server-${{ matrix.scenario }}.log.gz
            mc-assistant-neoforge/smoke-plains-*.png
          overwrite_files: true


  # -------------------------------------------------------------------------
  # The client. A headless server never draws anything, so the smocks, the
  # armour layer and the model under them live in code that has never been run.
  # This starts a real dedicated server AND a real game client (software
  # OpenGL on a virtual display), has the client join, puts a village and some
  # armour in front of the player over RCON, and publishes screenshots.
  # Like the others it can never fail the build.
  # -------------------------------------------------------------------------
  client:
    runs-on: ubuntu-latest
    # The look round now has some thirty stages (the town's life, the economy, the wars); it ran 38 minutes
    # before the economy's and the wars' were added.
    timeout-minutes: 150   # 0.292.0 took 85 minutes with every stage
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libxrandr2 libxxf86vm1 libxi6 libxcursor1 libxinerama1 imagemagick netcat-openbsd

      - name: Prepare a server directory and a client directory
        working-directory: mc-assistant-neoforge
        run: |
          mkdir -p run/config run-client
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'EOF'
          level-seed=7331
          level-type=minecraft:normal
          generate-structures=true
          online-mode=false
          spawn-protection=0
          max-tick-time=-1
          view-distance=10
          simulation-distance=6
          sync-chunk-writes=false
          enable-rcon=true
          rcon.port=25575
          rcon.password=soak
          broadcast-rcon-to-ops=false
          motd=smoke
          EOF
          cat > run/config/mc_assistant-common.toml <<'EOF'
          [villages]
          naturalVillages = false
          EOF
          cat > run-client/options.txt <<'EOF'
          onboardAccessibility:false
          tutorialStep:none
          pauseOnLostFocus:false
          narrator:0
          fancyGraphics:false
          renderDistance:10
          simulationDistance:6
          maxFps:30
          guiScale:2
          joinedFirstServer:true
          skipMultiplayerWarning:true
          EOF

      - name: Start the server
        working-directory: mc-assistant-neoforge
        run: |
          chmod +x gradlew
          nohup ./gradlew --no-daemon runServer > server-gradle.log 2>&1 &

      - name: Start the client on a virtual display
        working-directory: mc-assistant-neoforge
        run: |
          nohup Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset > xvfb.log 2>&1 &
          sleep 3
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          glxinfo -B > glxinfo.txt 2>&1 || true
          head -12 glxinfo.txt
          # The server has to be listening before the client is told to join it.
          for i in $(seq 1 300); do nc -z localhost 25565 && break; sleep 5; done
          nc -z localhost 25565 && echo "the server is listening"
          nohup ./gradlew --no-daemon -Psmoke=true runSmoke > client-gradle.log 2>&1 &

      - name: Look at the village
        working-directory: mc-assistant-neoforge
        run: |
          export DISPLAY=:99
          set +e
          python3 tools/realworld/smoke.py | tee smoke.txt
          echo "smoke exit: ${PIPESTATUS[0]}"
          set -e
          sleep 3

      - name: Collect the logs
        if: always()
        working-directory: mc-assistant-neoforge
        run: |
          echo "[REAL] ---- glxinfo ----" >> smoke.txt
          head -20 glxinfo.txt >> smoke.txt 2>/dev/null || true
          echo "[REAL] ---- the client's log: anything it complained about ----" >> smoke.txt
          grep -aE "Exception|Caused by|ERROR|FATAL|mc_assistant|GLFW|OpenGL|Crash" run-client/logs/latest.log 2>/dev/null | grep -av "Ambiguity\|^    at " | tail -120 >> smoke.txt || true
          echo "[REAL] ---- the client's crash reports ----" >> smoke.txt
          ls run-client/crash-reports 2>/dev/null >> smoke.txt || true
          head -80 run-client/crash-reports/*.txt 2>/dev/null >> smoke.txt || true
          echo "[REAL] ---- the last of the client's gradle output ----" >> smoke.txt
          tail -40 client-gradle.log >> smoke.txt 2>/dev/null || true
          echo "[REAL] ---- the server's log: anything from the mod ----" >> smoke.txt
          grep -aE "Exception|Caused by|ERROR|mc_assistant|com\.jrpetty" run/logs/latest.log 2>/dev/null | grep -av "Ambiguity\|^    at " | tail -60 >> smoke.txt || true
          gzip -c run-client/logs/latest.log > client.log.gz 2>/dev/null || true
          wc -l smoke.txt
          ls -la smoke-*.png || true

      - name: Stop everything
        if: always()
        run: pkill -f "net.minecraft" || true; pkill -f "runServer" || true; pkill -f "runSmoke" || true; pkill Xvfb || true

      - name: Publish the pictures and the report
        if: always()
        # A hundred and forty pictures at once now and then meet GitHub's secondary rate limit on one of them;
        # the smoke's own verdict is the step before, so a picture refused does not fail the run.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: village-test-latest
          name: "Village behaviour test output (latest)"
          prerelease: true
          make_latest: "false"
          body: "Raw output of the empirical village tests. Not a mod build."
          files: |
            mc-assistant-neoforge/smoke.txt
            mc-assistant-neoforge/smoke-*.png
            mc-assistant-neoforge/client.log.gz
          overwrite_files: true
