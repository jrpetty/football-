name: Dev classpath

# The compile classpath of the mod (Minecraft with NeoForge, and every library), packed up
# and published to the "dev-classpath" release, so the code can be type-checked with plain
# javac on a machine that cannot reach the NeoForge maven. Started by touching
# tools/classpath.trigger (outside the mod folder, so it never cancels a build).

on:
  push:
    branches:
      - claude/minecraft-ai-assistant-44hj4f
    paths:
      - "tools/classpath.trigger"
      - ".github/workflows/dev-classpath.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classpath:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile, and write down the classpath
        working-directory: mc-assistant-neoforge
        run: |
          chmod +x gradlew
          cat > /tmp/cp.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              p.tasks.register('dumpClasspath') {
                dependsOn 'compileJava'
                doLast {
                  new File(p.buildDir, 'cp.txt').text = p.sourceSets.main.compileClasspath.files.join('\n')
                }
              }
            }
          }
          EOF
          ./gradlew --no-daemon -Pgametest=true -I /tmp/cp.gradle dumpClasspath
          wc -l build/cp.txt
          mkdir -p /tmp/devcp/lib
          i=0
          while read -r f; do
            [ -z "$f" ] && continue
            i=$((i+1))
            if [ -f "$f" ]; then cp "$f" "/tmp/devcp/lib/$(printf '%03d' $i)-$(basename "$f")";
            elif [ -d "$f" ]; then (cd "$f" && zip -qr "/tmp/devcp/lib/$(printf '%03d' $i)-dir.jar" .); fi
          done < build/cp.txt
          ls -la /tmp/devcp/lib | head -50
          du -sh /tmp/devcp/lib
          (cd /tmp/devcp && tar czf /tmp/devcp.tgz lib)
          ls -la /tmp/devcp.tgz

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-classpath
          name: "Dev classpath (for type-checking with javac)"
          body: The mod's compile classpath, for javac on a machine without the NeoForge maven.
          files: /tmp/devcp.tgz
